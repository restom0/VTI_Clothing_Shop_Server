name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || 'VTI_Clothing_Shop_Server' }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and Test with Maven
        id: maven_verify
        working-directory: ./clothing_shop
        continue-on-error: true
        run: chmod +x ./mvnw && ./mvnw -B verify # runs tests + JaCoCo coverage gate

      - name: Generate JaCoCo report after failed tests
        if: ${{ always() && steps.maven_verify.outcome == 'failure' }}
        working-directory: ./clothing_shop
        continue-on-error: true
        run: ./mvnw -B jacoco:report -DskipTests

      - name: Publish test results
        if: ${{ always() }}
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5
        with:
          report_paths: "clothing_shop/target/surefire-reports/TEST-*.xml"
          check_name: Server test results
          fail_on_failure: false

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-coverage
          path: clothing_shop/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Validate Sonar configuration
        id: sonar_config
        if: ${{ always() }}
        shell: bash
        run: |
          missing=()
          [ -n "${SONAR_TOKEN}" ] || missing+=("SONAR_TOKEN secret")
          [ -n "${SONAR_ORGANIZATION}" ] || missing+=("SONAR_ORGANIZATION secret")
          [ -n "${SONAR_PROJECT_KEY}" ] || missing+=("SONAR_PROJECT_KEY secret")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required Sonar configuration: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          printf '::notice::If SonarCloud Automatic Analysis is enabled for this project, disable it before using CI analysis.\n'

      - name: SonarCloud Scan
        id: sonar_scan
        if: ${{ always() && steps.sonar_config.outputs.ready == 'true' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          projectBaseDir: clothing_shop
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}

      - name: SonarQube Quality Gate
        if: ${{ always() && steps.sonar_scan.outcome == 'success' }}
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: clothing_shop/.scannerwork/report-task.txt

      - name: Fail if Maven verify failed
        if: ${{ steps.maven_verify.outcome == 'failure' }}
        shell: bash
        run: |
          printf '::error::Maven verify failed. See test and build logs above.\n'
          exit 1
