x-logstash-logging: &logstash-logging
  driver: gelf
  options:
    gelf-address: "udp://localhost:12201"
    tag: "{{.Name}}"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-int}
      POSTGRESQL_URL: jdbc:postgresql://database:5432/clothing_shop
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      MONGODB_URI: "mongodb://mongo:27017/clothing_shop_read_model?serverSelectionTimeoutMS=2000"
      OAUTH2_SUCCESS_REDIRECT_URL: ${OAUTH2_SUCCESS_REDIRECT_URL:-http://localhost:5173/oauth2/success}
      OAUTH2_FAILURE_REDIRECT_URL: ${OAUTH2_FAILURE_REDIRECT_URL:-http://localhost:5173/oauth2/failure}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      TWITTER_OAUTH_CLIENT_ID: ${TWITTER_OAUTH_CLIENT_ID:-}
      TWITTER_OAUTH_CLIENT_SECRET: ${TWITTER_OAUTH_CLIENT_SECRET:-}
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: vti-clothing-shop-server
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=vti,deployment.environment=docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: 10000
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mongo:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - clothing_network
    logging: *logstash-logging

  database:
    image: postgres:16-alpine
    container_name: clothing_shop_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clothing_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clothing_shop"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clothing_network

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9.0.3-alpine}
    container_name: clothing_shop_valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - clothing_network

  mongo:
    image: mongo:${MONGO_VERSION:-8.2.7}
    container_name: clothing_shop_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - clothing_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.150.1}
    container_name: clothing_shop_otel_collector
    command:
      - --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ../docker/observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
      - "13133:13133"
    depends_on:
      elasticsearch:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - clothing_network
    logging: *logstash-logging

  prometheus:
    image: prom/prometheus:v3.5.2
    container_name: clothing_shop_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ../docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - clothing_network

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.0.1}
    container_name: clothing_shop_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - clothing_network

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.1}
    container_name: clothing_shop_loki
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ../docker/observability/loki-config.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - clothing_network

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.10.5}
    container_name: clothing_shop_tempo
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ../docker/observability/tempo-config.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - clothing_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.6}
    container_name: clothing_shop_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - clothing_network

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.17.6}
    container_name: clothing_shop_logstash
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ../docker/observability/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "12201:12201/udp"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - clothing_network

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.17.6}
    container_name: clothing_shop_kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - clothing_network

volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  elasticsearch_data:

networks:
  clothing_network:
    driver: bridge
