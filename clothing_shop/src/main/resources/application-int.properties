# Integration environment profile for local Docker and shared integration testing.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
logging.level.org.springframework=${SPRING_LOG_LEVEL:info}
logging.level.org.postgresql=${POSTGRES_LOG_LEVEL:info}
logging.level.org.mongodb.driver=${MONGO_LOG_LEVEL:warn}
application.rate-limit.enabled=${SPRING_RATE_LIMIT_ENABLED:true}
application.rate-limit.default-policy.name=default
application.rate-limit.default-policy.capacity=${SPRING_RATE_LIMIT_DEFAULT_CAPACITY:300}
application.rate-limit.default-policy.refill-tokens=${SPRING_RATE_LIMIT_DEFAULT_REFILL_TOKENS:300}
application.rate-limit.default-policy.refill-period=${SPRING_RATE_LIMIT_DEFAULT_REFILL_PERIOD:60s}
application.rate-limit.routes[0].name=auth
application.rate-limit.routes[0].methods=POST
application.rate-limit.routes[0].path-patterns=/user/login,/user/register
application.rate-limit.routes[0].capacity=${SPRING_RATE_LIMIT_AUTH_CAPACITY:30}
application.rate-limit.routes[0].refill-tokens=${SPRING_RATE_LIMIT_AUTH_REFILL_TOKENS:30}
application.rate-limit.routes[0].refill-period=${SPRING_RATE_LIMIT_AUTH_REFILL_PERIOD:60s}
application.rate-limit.routes[1].name=payment
application.rate-limit.routes[1].methods=POST
application.rate-limit.routes[1].path-patterns=/order/checkout,/order/success,/order/cancel
application.rate-limit.routes[1].capacity=${SPRING_RATE_LIMIT_PAYMENT_CAPACITY:60}
application.rate-limit.routes[1].refill-tokens=${SPRING_RATE_LIMIT_PAYMENT_REFILL_TOKENS:60}
application.rate-limit.routes[1].refill-period=${SPRING_RATE_LIMIT_PAYMENT_REFILL_PERIOD:60s}
application.rate-limit.routes[2].name=write
application.rate-limit.routes[2].methods=POST,PUT,PATCH,DELETE
application.rate-limit.routes[2].path-patterns=/**
application.rate-limit.routes[2].capacity=${SPRING_RATE_LIMIT_WRITE_CAPACITY:120}
application.rate-limit.routes[2].refill-tokens=${SPRING_RATE_LIMIT_WRITE_REFILL_TOKENS:120}
application.rate-limit.routes[2].refill-period=${SPRING_RATE_LIMIT_WRITE_REFILL_PERIOD:60s}
