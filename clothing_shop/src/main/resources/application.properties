# Application Name
spring.application.name=clothing_shop
spring.profiles.default=${SPRING_PROFILES_DEFAULT:int}
# DataSource Configuration
spring.datasource.url=${POSTGRESQL_URL:jdbc:postgresql://localhost:5432/clothing_shop}
spring.datasource.username=${POSTGRESQL_USERNAME:postgres}
spring.datasource.password=${POSTGRESQL_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
application.time-zone=${APPLICATION_TIME_ZONE:UTC}
spring.data.redis.host=${VALKEY_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${VALKEY_PORT:${REDIS_PORT:6379}}
spring.data.redis.username=${VALKEY_USERNAME:${REDIS_USERNAME:}}
spring.data.redis.password=${VALKEY_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.repositories.enabled=false
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/clothing_shop_read_model?serverSelectionTimeoutMS=2000}
read-model.bootstrap.enabled=${READ_MODEL_BOOTSTRAP_ENABLED:true}
# JWT Security Configuration
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:360000000}
logging.level.org.springframework=info
logging.level.org.postgresql=info
logging.level.org.mongodb.driver=warn
spring.messages.basename=labels/labels
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=en
spring.web.locale-resolver=accept-header
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payment.return-url=${PAYMENT_RETURN_URL:http://localhost:8080/order/success}
payment.cancel-url=${PAYMENT_CANCEL_URL:http://localhost:8080/order/cancel}
payment.currency=${PAYMENT_CURRENCY:VND}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.checkout-session-url=${STRIPE_CHECKOUT_SESSION_URL:https://api.stripe.com/v1/checkout/sessions}
zalopay.app-id=${ZALOPAY_APP_ID:}
zalopay.key1=${ZALOPAY_KEY1:}
zalopay.create-order-url=${ZALOPAY_CREATE_ORDER_URL:https://sb-openapi.zalopay.vn/v2/create}
zalopay.app-user=${ZALOPAY_APP_USER:clothing-shop}
application.oauth2.login.success-redirect-url=${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth2/success}
application.oauth2.login.failure-redirect-url=${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:5173/oauth2/failure}
application.oauth2.client.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
application.oauth2.client.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
application.oauth2.client.google.scopes=openid,profile,email
application.oauth2.client.facebook.client-id=${FACEBOOK_OAUTH_CLIENT_ID:}
application.oauth2.client.facebook.client-secret=${FACEBOOK_OAUTH_CLIENT_SECRET:}
application.oauth2.client.facebook.scopes=public_profile,email
application.oauth2.client.twitter.client-id=${TWITTER_OAUTH_CLIENT_ID:}
application.oauth2.client.twitter.client-secret=${TWITTER_OAUTH_CLIENT_SECRET:}
application.oauth2.client.twitter.scopes=tweet.read,users.read,users.email
application.oauth2.client.twitter.authorization-uri=${TWITTER_OAUTH_AUTHORIZATION_URI:https://x.com/i/oauth2/authorize}
application.oauth2.client.twitter.token-uri=${TWITTER_OAUTH_TOKEN_URI:https://api.x.com/2/oauth2/token}
application.oauth2.client.twitter.user-info-uri=${TWITTER_OAUTH_USER_INFO_URI:https://api.x.com/2/users/me?user.fields=profile_image_url}
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-exclude=/error
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.syntax-highlight.theme=agate
server.port=${SERVER_PORT:8080}
microservices.grpc.server.enabled=${GRPC_SERVER_ENABLED:true}
microservices.grpc.server.port=${GRPC_SERVER_PORT:9091}
microservices.grpc.client.auth-target=${AUTH_GRPC_TARGET:localhost:9091}
microservices.grpc.client.payment-target=${PAYMENT_GRPC_TARGET:localhost:9091}
microservices.grpc.client.read-target=${READ_GRPC_TARGET:localhost:9091}
microservices.grpc.client.write-target=${WRITE_GRPC_TARGET:localhost:9091}
microservices.modules.auth.enabled=${AUTH_MODULE_ENABLED:true}
microservices.modules.payment.enabled=${PAYMENT_MODULE_ENABLED:true}
microservices.modules.read.enabled=${READ_MODULE_ENABLED:true}
microservices.modules.write.enabled=${WRITE_MODULE_ENABLED:true}
application.rate-limit.trust-proxy-headers=${SPRING_RATE_LIMIT_TRUST_PROXY_HEADERS:true}
application.rate-limit.client-ip-header=${SPRING_RATE_LIMIT_CLIENT_IP_HEADER:X-Forwarded-For}
application.rate-limit.cleanup-interval=${SPRING_RATE_LIMIT_CLEANUP_INTERVAL:300s}
application.rate-limit.bucket-ttl=${SPRING_RATE_LIMIT_BUCKET_TTL:600s}
application.rate-limit.excluded-paths=/actuator/**,/swagger-ui.html,/swagger-ui/**,/v3/api-docs,/v3/api-docs/**,/webjars/**,/health
