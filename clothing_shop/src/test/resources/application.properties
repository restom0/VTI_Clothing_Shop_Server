spring.datasource.url=jdbc:h2:mem:clothing_shop_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
application.time-zone=UTC
spring.sql.init.mode=never
spring.data.redis.host=${VALKEY_HOST:localhost}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.repositories.enabled=false
spring.data.mongodb.uri=mongodb://localhost:27017/clothing_shop_read_model_test?serverSelectionTimeoutMS=2000
read-model.bootstrap.enabled=false
spring.messages.basename=labels/labels
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=en
spring.web.locale-resolver=accept-header
application.rate-limit.enabled=false
security.jwt.secret-key=${TEST_JWT_SECRET_KEY:dGVzdC1vbmx5LWp3dC1zZWNyZXQtY2xvdGhpbmctc2hvcC0zMi1ieXRlcy1taW4=}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:360000000}
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payment.return-url=http://localhost:8080/order/success
payment.cancel-url=http://localhost:8080/order/cancel
payment.currency=VND
stripe.secret-key=
stripe.checkout-session-url=https://api.stripe.com/v1/checkout/sessions
zalopay.app-id=
zalopay.key1=
zalopay.create-order-url=https://sb-openapi.zalopay.vn/v2/create
zalopay.app-user=clothing-shop
microservices.grpc.server.enabled=false
