worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api_read_cache:20m
                     max_size=512m
                     inactive=30m
                     use_temp_path=off;

    map $request_method $write_limit_key {
        default "";
        POST $binary_remote_addr;
        PUT $binary_remote_addr;
        PATCH $binary_remote_addr;
        DELETE $binary_remote_addr;
    }

    map $request_uri $auth_limit_key {
        default "";
        ~^/api/user/(login|register)$ $binary_remote_addr;
        ~^/user/(login|register)$ $binary_remote_addr;
    }

    map $request_uri $payment_limit_key {
        default "";
        ~^/api/order/(checkout|success|cancel)$ $binary_remote_addr;
        ~^/order/(checkout|success|cancel)$ $binary_remote_addr;
    }

    map $request_method $skip_cache_by_method {
        default 1;
        GET 0;
        HEAD 0;
    }

    map $http_authorization $skip_cache_by_auth {
        default 1;
        "" 0;
    }

    map $http_cookie $skip_cache_by_cookie {
        default 1;
        "" 0;
    }

    map $arg_nocache $skip_cache_by_arg {
        default 0;
        ~.+ 1;
    }

    map $http_cache_control $skip_cache_by_control {
        default 0;
        ~*no-cache 1;
        ~*no-store 1;
    }

    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
    limit_req_zone $write_limit_key zone=api_write_limit:10m rate=8r/s;
    limit_req_zone $auth_limit_key zone=api_auth_limit:10m rate=3r/s;
    limit_req_zone $payment_limit_key zone=api_payment_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=client_conn_limit:10m;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'cache="$upstream_cache_status" upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream clothing_shop_http {
        least_conn;
        zone clothing_shop_http 64k;
        server clothing-shop-server:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream auth_grpc {
        least_conn;
        zone auth_grpc 64k;
        server clothing-shop-server:9091 max_fails=3 fail_timeout=10s;
    }

    upstream payment_grpc {
        least_conn;
        zone payment_grpc 64k;
        server clothing-shop-server:9091 max_fails=3 fail_timeout=10s;
    }

    upstream read_grpc {
        least_conn;
        zone read_grpc 64k;
        server clothing-shop-server:9091 max_fails=3 fail_timeout=10s;
    }

    upstream write_grpc {
        least_conn;
        zone write_grpc 64k;
        server clothing-shop-server:9091 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Gateway nginx always;
        add_header X-RateLimit-Policy "general=30r/s; write=8r/s; auth=3r/s; payment=5r/s" always;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/api/imported-product/(colors|materials|sizes)$ {
            rewrite ^/api(/.*)$ $1 break;
            limit_conn client_conn_limit 40;
            limit_req zone=api_general_limit burst=60 nodelay;
            limit_req zone=api_write_limit burst=20 nodelay;
            limit_req zone=api_auth_limit burst=6 nodelay;
            limit_req zone=api_payment_limit burst=10 nodelay;
            proxy_cache api_read_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 30m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            proxy_no_cache $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            add_header Cache-Control "public, max-age=1800" always;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://clothing_shop_http;
        }

        location ~ ^/(imported-product/(colors|materials|sizes))$ {
            limit_conn client_conn_limit 40;
            limit_req zone=api_general_limit burst=60 nodelay;
            limit_req zone=api_write_limit burst=20 nodelay;
            limit_req zone=api_auth_limit burst=6 nodelay;
            limit_req zone=api_payment_limit burst=10 nodelay;
            proxy_cache api_read_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 30m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            proxy_no_cache $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            add_header Cache-Control "public, max-age=1800" always;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://clothing_shop_http;
        }

        location = /api/stat/analysis {
            rewrite ^/api(/.*)$ $1 break;
            limit_conn client_conn_limit 40;
            limit_req zone=api_general_limit burst=60 nodelay;
            limit_req zone=api_write_limit burst=20 nodelay;
            limit_req zone=api_auth_limit burst=6 nodelay;
            limit_req zone=api_payment_limit burst=10 nodelay;
            proxy_cache api_read_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 10s;
            proxy_cache_bypass $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            proxy_no_cache $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            add_header Cache-Control "public, max-age=30" always;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://clothing_shop_http;
        }

        location = /stat/analysis {
            limit_conn client_conn_limit 40;
            limit_req zone=api_general_limit burst=60 nodelay;
            limit_req zone=api_write_limit burst=20 nodelay;
            limit_req zone=api_auth_limit burst=6 nodelay;
            limit_req zone=api_payment_limit burst=10 nodelay;
            proxy_cache api_read_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 10s;
            proxy_cache_bypass $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            proxy_no_cache $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            add_header Cache-Control "public, max-age=30" always;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://clothing_shop_http;
        }

        location ~ ^/api/(brands|categories|product|on-sale-product|voucher)(/.*)?$ {
            rewrite ^/api(/.*)$ $1 break;
            limit_conn client_conn_limit 40;
            limit_req zone=api_general_limit burst=60 nodelay;
            limit_req zone=api_write_limit burst=20 nodelay;
            limit_req zone=api_auth_limit burst=6 nodelay;
            limit_req zone=api_payment_limit burst=10 nodelay;
            proxy_cache api_read_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 30s;
            proxy_cache_bypass $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            proxy_no_cache $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://clothing_shop_http;
        }

        location ~ ^/(brands|categories|product|on-sale-product|voucher)(/.*)?$ {
            limit_conn client_conn_limit 40;
            limit_req zone=api_general_limit burst=60 nodelay;
            limit_req zone=api_write_limit burst=20 nodelay;
            limit_req zone=api_auth_limit burst=6 nodelay;
            limit_req zone=api_payment_limit burst=10 nodelay;
            proxy_cache api_read_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 30s;
            proxy_cache_bypass $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            proxy_no_cache $skip_cache_by_method $skip_cache_by_auth $skip_cache_by_cookie $skip_cache_by_arg $skip_cache_by_control;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://clothing_shop_http;
        }

        location /api/ {
            rewrite ^/api(/.*)$ $1 break;
            limit_conn client_conn_limit 40;
            limit_req zone=api_general_limit burst=60 nodelay;
            limit_req zone=api_write_limit burst=20 nodelay;
            limit_req zone=api_auth_limit burst=6 nodelay;
            limit_req zone=api_payment_limit burst=10 nodelay;
            proxy_pass http://clothing_shop_http;
        }

        location / {
            limit_conn client_conn_limit 40;
            limit_req zone=api_general_limit burst=60 nodelay;
            limit_req zone=api_write_limit burst=20 nodelay;
            limit_req zone=api_auth_limit burst=6 nodelay;
            limit_req zone=api_payment_limit burst=10 nodelay;
            proxy_pass http://clothing_shop_http;
        }
    }

    server {
        listen 9090 http2;
        server_name _;

        limit_conn client_conn_limit 20;
        limit_req zone=api_general_limit burst=30 nodelay;
        limit_req_status 429;
        limit_conn_status 429;

        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
        grpc_next_upstream error timeout http_500 http_502 http_503 http_504;
        grpc_next_upstream_tries 3;

        location /vti.clothing_shop.modules.v1.AuthModuleService/ {
            grpc_pass grpc://auth_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /vti.clothing_shop.modules.v1.PaymentModuleService/ {
            grpc_pass grpc://payment_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /vti.clothing_shop.modules.v1.ReadModuleService/ {
            grpc_pass grpc://read_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /vti.clothing_shop.modules.v1.WriteModuleService/ {
            grpc_pass grpc://write_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
