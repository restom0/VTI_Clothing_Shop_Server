apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.17.6
          ports:
            - name: gelf
              containerPort: 12201
              protocol: UDP
            - name: api
              containerPort: 9600
          env:
            - name: LS_JAVA_OPTS
              value: -Xms256m -Xmx256m
            - name: XPACK_MONITORING_ENABLED
              value: "false"
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app.kubernetes.io/name: logstash
  ports:
    - name: gelf
      port: 12201
      targetPort: gelf
      protocol: UDP
    - name: api
      port: 9600
      targetPort: api
