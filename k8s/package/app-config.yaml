apiVersion: v1
kind: ConfigMap
metadata:
  name: clothing-shop-server-config
  labels:
    app.kubernetes.io/name: clothing-shop-server
    app.kubernetes.io/component: package
data:
  SPRING_PROFILES_ACTIVE: production
  APPLICATION_TIME_ZONE: UTC
  POSTGRESQL_URL: jdbc:postgresql://postgres:5432/clothing_shop
  SERVER_PORT: "8080"
  GRPC_SERVER_PORT: "9091"
  AUTH_GRPC_TARGET: clothing-shop-server:9091
  PAYMENT_GRPC_TARGET: clothing-shop-server:9091
  READ_GRPC_TARGET: clothing-shop-server:9091
  WRITE_GRPC_TARGET: clothing-shop-server:9091
  VALKEY_HOST: valkey
  VALKEY_PORT: "6379"
  MONGODB_URI: mongodb://mongo:27017/clothing_shop_read_model?serverSelectionTimeoutMS=2000
  READ_MODEL_BOOTSTRAP_ENABLED: "true"
  SPRING_RATE_LIMIT_ENABLED: "true"
  SPRING_RATE_LIMIT_DEFAULT_CAPACITY: "120"
  SPRING_RATE_LIMIT_DEFAULT_REFILL_TOKENS: "120"
  SPRING_RATE_LIMIT_DEFAULT_REFILL_PERIOD: "60s"
  SPRING_RATE_LIMIT_AUTH_CAPACITY: "5"
  SPRING_RATE_LIMIT_AUTH_REFILL_TOKENS: "5"
  SPRING_RATE_LIMIT_AUTH_REFILL_PERIOD: "60s"
  SPRING_RATE_LIMIT_PAYMENT_CAPACITY: "20"
  SPRING_RATE_LIMIT_PAYMENT_REFILL_TOKENS: "20"
  SPRING_RATE_LIMIT_PAYMENT_REFILL_PERIOD: "60s"
  SPRING_RATE_LIMIT_WRITE_CAPACITY: "60"
  SPRING_RATE_LIMIT_WRITE_REFILL_TOKENS: "60"
  SPRING_RATE_LIMIT_WRITE_REFILL_PERIOD: "60s"
  OAUTH2_SUCCESS_REDIRECT_URL: https://example.com/oauth2/success
  OAUTH2_FAILURE_REDIRECT_URL: https://example.com/oauth2/failure
  PAYMENT_RETURN_URL: http://clothing-shop-server:8080/order/success
  PAYMENT_CANCEL_URL: http://clothing-shop-server:8080/order/cancel
  PAYMENT_CURRENCY: VND
  JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
  OTEL_SERVICE_NAME: vti-clothing-shop-server
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=vti,deployment.environment=kubernetes
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.vti-clothing-shop-monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
  OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
